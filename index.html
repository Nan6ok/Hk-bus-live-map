<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港巴士實時地圖 (多公司測試版)</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css' rel='stylesheet' />
    <link rel="stylesheet" href="style.css">
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #info-panel {
            position: absolute; top: 10px; left: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            max-width: 320px; z-index: 1000;
            font-size: 14px;
        }
        #info-panel h3 { margin: 0 0 10px 0; color: #333; }
        .legend { margin: 10px 0; padding-top: 10px; border-top: 1px solid #eee; }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; }
        .legend-color {
            width: 16px; height: 16px; border-radius: 50%;
            margin-right: 8px; border: 2px solid #fff;
        }
        .update-info { font-size: 0.85em; color: #666; margin-top: 10px; }
        #refresh-btn {
            background: #4CAF50; color: white; border: none;
            padding: 8px 15px; border-radius: 5px; margin-top: 10px;
            cursor: pointer; font-weight: bold;
        }
        #refresh-btn:hover { background: #45a049; }
        .debug { font-size: 0.75em; color: #888; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="info-panel">
        <h3>🚍 香港巴士實時地圖 (模擬測試版)</h3>
        <p>當前顯示: <strong><span id="bus-count">0</span> 輛巴士</strong></p>
        <div class="legend">
            <div class="legend-item"><div class="legend-color" style="background: #E2231A;"></div> 九巴 (KMB) - 101, 1A</div>
            <div class="legend-item"><div class="legend-color" style="background: #FFD100;"></div> 城巴 (CTB) - 962</div>
            <div class="legend-item"><div class="legend-color" style="background: #6DCFF6;"></div> 新大嶼山巴士 (NLB) - 1</div>
        </div>
        <p class="update-info">最後更新: <span id="update-time">--:--:--</span></p>
        <button id="refresh-btn">🔄 手動刷新數據</button>
        <p class="debug">狀態: <span id="status">正在加載...</span></p>
    </div>
    <div id="map"></div>
    <script type="module" src="app.js"></script>
</body>
</html>
